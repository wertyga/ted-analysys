<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <title>AI Tenders - Something went wrong</title>
  <style>
    body { margin: 0; padding: 0; background: #f3f6fb; color: #0f172a; font-family: Arial, Helvetica, sans-serif; -webkit-font-smoothing: antialiased; }
    table { border-collapse: collapse; }
    img { border: 0; display: block; outline: none; text-decoration: none; }
    .page { width: 100%; background: #f3f6fb; padding: 32px 12px; }
    .email { width: 100%; max-width: 680px; margin: 0 auto; background: #ffffff; border-radius: 24px; overflow: hidden; box-shadow: 0 18px 45px rgba(15, 23, 42, 0.08); }
    .hero { background: #0f172a; padding: 34px 34px 30px; color: #ffffff; }
    .brand-row { width: 100%; }
    .brand-logo { width: 52px; height: 52px; border-radius: 16px; background: #111827; }
    .brand-name { padding-left: 14px; font-size: 20px; line-height: 24px; font-weight: 700; }
    .eyebrow { margin: 34px 0 10px; color: #f87171; font-size: 13px; line-height: 18px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; }
    .hero-title { margin: 0; font-size: 34px; line-height: 40px; font-weight: 800; }
    .hero-text { margin: 14px 0 0; max-width: 520px; color: #cbd5e1; font-size: 15px; line-height: 23px; }
    .content { padding: 32px 34px 36px; }
    .alert-card { padding: 20px; border-radius: 18px; background: #fef2f2; border: 1px solid #fecaca; }
    .title { margin: 0 0 10px; color: #991b1b; font-size: 22px; line-height: 28px; font-weight: 800; }
    .text { margin: 0; color: #334155; font-size: 15px; line-height: 23px; }
    .footer { padding: 24px 34px 30px; background: #f8fafc; border-top: 1px solid #e2e8f0; color: #64748b; text-align: center; font-size: 12px; line-height: 18px; }
    .footer strong { color: #334155; }
    @media screen and (max-width: 520px) {
      .page { padding: 0; }
      .email { border-radius: 0; }
      .hero, .content, .footer { padding-left: 20px; padding-right: 20px; }
      .hero-title { font-size: 28px; line-height: 34px; }
    }
  </style>
</head>
<body>
  <div class="page">
    <table role="presentation" class="email" width="100%" cellpadding="0" cellspacing="0">
      <tr>
        <td class="hero">
          <table role="presentation" class="brand-row" cellpadding="0" cellspacing="0">
            <tr>
              <td width="52"><img class="brand-logo" src="https://travelwithme.b-cdn.net/icon_black_bg.png" width="52" height="52" alt="AI Tenders" /></td>
              <td class="brand-name">AI Tenders</td>
            </tr>
          </table>
          <p class="eyebrow">Service notice</p>
          <h1 class="hero-title">Something went wrong</h1>
          <p class="hero-text">AI Tenders could not complete the requested action.</p>
        </td>
      </tr>
      <tr>
        <td class="content">
          <div class="alert-card">
            <h2 class="title">Please try again later</h2>
            <p class="text">If the issue continues, contact support with a short description of what you were doing.</p>
          </div>
        </td>
      </tr>
      <tr>
        <td class="footer">
          <strong>AI Tenders</strong><br />
          This message was sent by AI Tenders after an application error.
        </td>
      </tr>
    </table>
  </div>
</body>
</html>
