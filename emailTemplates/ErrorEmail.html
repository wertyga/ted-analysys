<html>
<head>
  <meta charset="UTF-8">
  <style>

    a, a:focus, a:visited {
      text-decoration: none;
      color: #000;
    }

    p {
      color: #000;
    }

    .content {
      padding: 30px;
      text-align: center;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      font-family: Montserrat, "sans-serif";
    }

    h3 {
      font-weight: 400;
      font-size: 52px;
      margin-top: 0 !important;
      margin-bottom: 60px;
      line-height: 63px;
      color: #000;
    }

    .logo {
      margin: 0 auto 0 auto;
      width: 100%;
      max-width: 300px;
      border-radius: 50%;
    }

    @media screen and (max-width: 500px) {
      .content {
        padding: 10px;
      }
    }
  </style>
</head>
<body>
<div class="content">
  <img src="https://travelwithme.b-cdn.net/icon_black_bg.png" class="logo" />
  <h2>AI Tenders</h2>
  <br />
  <h3>Something went wrong in AI Tenders.</h3>
  <p>Please try again later. If the issue continues, contact support with a short description of what you were doing.</p>
</div>
</body>
</html>
