<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      text-align: center;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      font-family: Montserrat, "sans-serif";
    }

    .container {
      padding-left: 60px;
      padding-right: 60px;
    }
    .container > * {
      display: block;
      width: 100%;
    }

    a {
      color: #036068 !important;
      text-decoration: none;
      cursor: pointer !important;
    }

    .container {
      text-align: center;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      font-family: Roboto, RobotoDraft, Helvetica, Arial, "sans-serif";
      color: #000;
      padding: 30px;

    }

    h3 {
      font-weight: 600;
      font-size: 26px;
      margin-bottom: 50px;
      margin-top: 0 !important;
    }

    .logo {
      margin: 0 auto 0 auto;
      max-width: 200px;
      margin-bottom: 40px;
      border-radius: 50%;
    }

    .buttonWrapper {
      width: 100%;
      max-width: 265px;
      display: table;
      margin: 0 auto;
    }

    .button {
      background-color: #036068;
      font-weight: 600 !important;
      font-size: 14px;
      color: #ffffff !important;
      border-radius: 22px;
      height: 48px;
      display: table-cell;
      text-align: center;
      vertical-align: middle;
      border: none;
      outline: none;
      cursor: pointer;
      margin: 0 auto;
    }

    .subscribe-block__social > *:not(:last-child) {
      margin-right: 10px;
    }

    .footer {
      background-color: #c2c2c2;
      padding-top: 24px;
      padding-bottom: 24px;
      margin: 0;
      font-size: 12px;
      font-weight: 400;
    }
    .footer a {
      text-decoration: underline;
      color: #000 !important;
    }

    .code a {
      color: #000 !important;
      font-size: 20px;
    }

    @media screen and (max-width: 500px) {
      .container {
        padding: 0;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <img src="https://travelwithme.b-cdn.net/icon_black_bg.png" class="logo" />
  <h2>AI Tenders</h2>

  <div class="content">
    <h3>Forgot your password?</h3>

    <p class="subtitle"><strong>Hello</strong>, use the code below to continue in AI Tenders.</p>

    <div class="buttonWrapper">
      <p>{{recoveryToken}}</p>
    </div>

    <p class="subtitle">If you did not request this email, you can safely ignore it.</p>
  </div>

  <p class="footer">
    You received this email because you have an AI Tenders account.
  </p>
</div>
</body>
</html>
