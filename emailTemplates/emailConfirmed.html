<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      text-align: center;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      font-family: Montserrat, "sans-serif";
    }

    .container {
      padding-left: 60px;
      padding-right: 60px;
    }
    .container > * {
      display: block;
      width: 100%;
    }

    a {
      color: #036068 !important;
      text-decoration: none;
      cursor: pointer !important;
    }

    .container {
      text-align: center;
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      font-family: Roboto, RobotoDraft, Helvetica, Arial, "sans-serif";
      color: #000;
      padding: 30px;

    }

    h3 {
      font-weight: 600;
      font-size: 26px;
      margin-bottom: 50px;
      margin-top: 0 !important;
    }

    .logo {
      margin: 0 auto 0 auto;
      max-width: 200px;
      border-radius: 20px;
      box-shadow: 6px 6px 10px rgba(0, 0, 0, .3);
      margin-bottom: 40px;
      border-radius: 50%;
    }

    .subscribe-block__social > *:not(:last-child) {
      margin-right: 10px;
    }

    .footer {
      background-color: #c2c2c2;
      padding-top: 24px;
      padding-bottom: 24px;
      margin: 0;
      font-size: 12px;
      font-weight: 400;
    }
    .footer a {
      text-decoration: underline;
      color: #000 !important;
    }

    .code a {
      color: #000 !important;
      font-size: 20px;
    }

    @media screen and (max-width: 500px) {
      .container {
        padding: 0;
      }
    }
  </style>
</head>
<body>
<div class="container">
  <img src="https://travelwithme.b-cdn.net/icon_black_bg.png" class="logo"/>
  <h2>AI Tenders</h2>

  <div class="content">
    <h3>Hi <strong>{{companyName}}</strong>, <br /> your email has been confirmed.</h3>
    <p class="subtitle">Your AI Tenders account is ready. You can now search tenders, save opportunities, and review AI analysis results.</p>
  </div>

  <p class="footer">
    You received this email because your AI Tenders account email was confirmed.
  </p>
</div>
</body>
</html>
