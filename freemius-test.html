<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Freemius Checkout Test</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f7f8fa;
        --panel: #ffffff;
        --text: #1f2933;
        --muted: #5f6b7a;
        --border: #d9dee7;
        --primary: #1769e0;
        --primary-hover: #1259bf;
        --danger: #b42318;
        --success: #067647;
        --code: #0f172a;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--text);
        font:
          14px/1.45 Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          'Segoe UI',
          sans-serif;
      }

      main {
        width: min(980px, calc(100% - 32px));
        margin: 32px auto;
      }

      h1 {
        margin: 0 0 6px;
        font-size: 28px;
        line-height: 1.2;
        font-weight: 700;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .layout {
        display: grid;
        grid-template-columns: minmax(0, 400px) minmax(0, 1fr);
        gap: 16px;
        margin-top: 24px;
      }

      section {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 18px;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 16px;
        line-height: 1.3;
      }

      label {
        display: block;
        margin: 14px 0 6px;
        font-weight: 600;
      }

      input {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 10px;
        color: var(--text);
        background: #fff;
        font: inherit;
      }

      select {
        width: 100%;
        min-height: 40px;
        border: 1px solid var(--border);
        border-radius: 6px;
        padding: 9px 10px;
        color: var(--text);
        background: #fff;
        font: inherit;
      }

      input:focus,
      select:focus {
        outline: 2px solid rgba(23, 105, 224, 0.22);
        border-color: var(--primary);
      }

      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }

      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 18px;
      }

      button,
      a.button {
        min-height: 40px;
        border: 1px solid transparent;
        border-radius: 6px;
        padding: 9px 12px;
        font: inherit;
        font-weight: 650;
        text-align: center;
        text-decoration: none;
        cursor: pointer;
      }

      button.primary {
        background: var(--primary);
        color: #fff;
      }

      button.primary:hover {
        background: var(--primary-hover);
      }

      button.secondary,
      a.button.secondary {
        background: #fff;
        color: var(--text);
        border-color: var(--border);
      }

      button:disabled,
      a.button[aria-disabled='true'] {
        cursor: not-allowed;
        opacity: 0.5;
      }

      .status {
        margin-top: 12px;
        min-height: 20px;
        font-weight: 600;
      }

      .status.ok {
        color: var(--success);
      }

      .status.error {
        color: var(--danger);
      }

      pre {
        min-height: 480px;
        max-height: 72vh;
        margin: 0;
        overflow: auto;
        border-radius: 6px;
        background: var(--code);
        color: #e5edf7;
        padding: 14px;
        white-space: pre-wrap;
        word-break: break-word;
        font:
          12px/1.45 ui-monospace,
          SFMono-Regular,
          Menlo,
          Consolas,
          'Liberation Mono',
          monospace;
      }

      .hint {
        margin-top: 10px;
        font-size: 12px;
      }

      @media (max-width: 820px) {
        .layout {
          grid-template-columns: 1fr;
        }

        .actions,
        .row {
          grid-template-columns: 1fr;
        }

        pre {
          min-height: 300px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Freemius checkout test</h1>
      <p>Use this page with the local Nest API and a real user bearer token.</p>

      <div class="layout">
        <section>
          <h2>Request</h2>

          <label for="apiUrl">API URL</label>
          <input id="apiUrl" value="http://localhost:3000" />

          <label for="token">Bearer token</label>
          <input id="token" placeholder="Paste user token" />

          <label for="planSelect">Product plans</label>
          <select id="planSelect">
            <option value="">Load plans to select</option>
          </select>

          <div class="row">
            <div>
              <label for="planId">Plan ID</label>
              <input id="planId" placeholder="Optional" />
            </div>
            <div>
              <label for="quota">Quota</label>
              <input id="quota" inputmode="numeric" placeholder="Optional" />
            </div>
          </div>

          <label for="licenseId">License ID for upgrade</label>
          <input id="licenseId" placeholder="Optional" />

          <div class="actions">
            <button id="loadPricing" class="secondary">Load plans</button>
            <button id="createCheckout" class="primary">Create checkout</button>
            <button id="openOverlay" class="secondary" disabled>
              Open overlay
            </button>
            <button id="openHosted" class="secondary" disabled>
              Hosted checkout
            </button>
            <button id="checkEntitlement" class="secondary">
              Check entitlement
            </button>
            <button id="changeSubscription" class="secondary">
              Change subscription
            </button>
            <button id="cancelSubscription" class="secondary">
              Cancel subscription
            </button>
            <button id="loadPortal" class="secondary">Customer portal</button>
          </div>

          <div id="status" class="status"></div>
          <p class="hint">
            Overlay imports @freemius/checkout from esm.sh. Hosted checkout uses
            only the backend-generated link.
          </p>
        </section>

        <section>
          <h2>Log</h2>
          <pre id="log">Ready.</pre>
        </section>
      </div>
    </main>

    <script type="module">
      const state = {
        checkout: null,
      };

      const fields = {
        apiUrl: document.getElementById('apiUrl'),
        token: document.getElementById('token'),
        planId: document.getElementById('planId'),
        planSelect: document.getElementById('planSelect'),
        quota: document.getElementById('quota'),
        licenseId: document.getElementById('licenseId'),
      };

      const buttons = {
        loadPricing: document.getElementById('loadPricing'),
        createCheckout: document.getElementById('createCheckout'),
        openOverlay: document.getElementById('openOverlay'),
        openHosted: document.getElementById('openHosted'),
        checkEntitlement: document.getElementById('checkEntitlement'),
        changeSubscription: document.getElementById('changeSubscription'),
        cancelSubscription: document.getElementById('cancelSubscription'),
        loadPortal: document.getElementById('loadPortal'),
      };

      const statusEl = document.getElementById('status');
      const logEl = document.getElementById('log');

      restoreForm();

      for (const field of Object.values(fields)) {
        field.addEventListener('input', persistForm);
      }

      buttons.loadPricing.addEventListener('click', loadPricing);
      buttons.createCheckout.addEventListener('click', createCheckout);
      buttons.openOverlay.addEventListener('click', openOverlay);
      buttons.openHosted.addEventListener('click', openHosted);
      buttons.checkEntitlement.addEventListener('click', checkEntitlement);
      buttons.changeSubscription.addEventListener('click', changeSubscription);
      buttons.cancelSubscription.addEventListener('click', cancelSubscription);
      buttons.loadPortal.addEventListener('click', loadPortal);
      fields.planSelect.addEventListener('change', () => {
        fields.planId.value = fields.planSelect.value;
        persistForm();
      });

      async function loadPricing() {
        setStatus('Loading pricing...');

        try {
          const pricing = await apiFetch('/freemius/pricing');
          const plans = pricing.plans ?? [];

          fields.planSelect.innerHTML = [
            '<option value="">Select a plan</option>',
            ...plans.map((plan) => {
              const id = escapeHtml(String(plan.id ?? ''));
              const title = escapeHtml(plan.title ?? plan.name ?? id);
              return `<option value="${id}">${title} - ${id}</option>`;
            }),
          ].join('');

          log('Pricing loaded', pricing);
          setStatus(`${plans.length} plans loaded.`, 'ok');
        } catch (error) {
          setStatus(error.message, 'error');
          log('Load pricing failed', serializeError(error));
        }
      }

      async function createCheckout() {
        setStatus('Creating checkout...');
        state.checkout = null;
        updateCheckoutButtons();

        const body = cleanPayload({
          planId: fields.planId.value.trim(),
          licenseId: fields.licenseId.value.trim(),
          quota: fields.quota.value.trim()
            ? Number(fields.quota.value.trim())
            : undefined,
        });

        try {
          const checkout = await apiFetch('/freemius/checkout', {
            method: 'POST',
            body: JSON.stringify(body),
          });

          state.checkout = checkout;
          log('Checkout created', checkout);
          setStatus('Checkout created.', 'ok');
          updateCheckoutButtons();
        } catch (error) {
          setStatus(error.message, 'error');
          log('Create checkout failed', serializeError(error));
        }
      }

      async function openOverlay() {
        if (!state.checkout?.options) {
          setStatus('Create checkout first.', 'error');
          return;
        }

        setStatus('Loading overlay checkout...');

        try {
          const { Checkout } =
            await import('https://esm.sh/@freemius/checkout@1.4.1');
          const checkout = new Checkout(state.checkout.options);

          checkout.open({
            success: async (data) => {
              log('Overlay purchase callback', data);
              setStatus('Processing purchase...');

              try {
                const result = await apiFetch('/freemius/purchase', {
                  method: 'POST',
                  body: JSON.stringify(data),
                });
                log('Purchase processed', result);
                setStatus('Purchase processed.', 'ok');
              } catch (error) {
                setStatus(error.message, 'error');
                log('Purchase processing failed', serializeError(error));
              }
            },
          });

          setStatus('Overlay opened.', 'ok');
        } catch (error) {
          setStatus(error.message, 'error');
          log('Overlay failed', serializeError(error));
        }
      }

      function openHosted() {
        if (!state.checkout?.link) {
          setStatus('Create checkout first.', 'error');
          return;
        }

        window.location.href = state.checkout.link;
      }

      async function checkEntitlement() {
        setStatus('Checking entitlement...');

        try {
          const result = await apiFetch('/freemius/entitlement');
          log('Entitlement', result);
          setStatus(
            result.entitlement
              ? 'Active entitlement found.'
              : 'No entitlement.',
            result.entitlement ? 'ok' : '',
          );
        } catch (error) {
          setStatus(error.message, 'error');
          log('Entitlement check failed', serializeError(error));
        }
      }

      async function changeSubscription() {
        const planId = fields.planId.value.trim();

        if (!planId) {
          setStatus('Plan ID is required.', 'error');
          return;
        }

        setStatus('Creating change checkout...');

        try {
          const checkout = await apiFetch(
            '/freemius/subscription/change-checkout',
            {
              method: 'POST',
              body: JSON.stringify(
                cleanPayload({
                  planId,
                  quota: fields.quota.value.trim()
                    ? Number(fields.quota.value.trim())
                    : undefined,
                }),
              ),
            },
          );

          state.checkout = checkout;
          log('Subscription change checkout created', checkout);
          setStatus('Change checkout created.', 'ok');
          updateCheckoutButtons();
        } catch (error) {
          setStatus(error.message, 'error');
          log('Change checkout failed', serializeError(error));
        }
      }

      async function cancelSubscription() {
        if (!confirm('Cancel the active Freemius subscription?')) {
          return;
        }

        setStatus('Cancelling subscription...');

        try {
          const result = await apiFetch('/freemius/subscription/cancel', {
            method: 'POST',
            body: JSON.stringify({ feedback: 'Cancelled from test page' }),
          });

          log('Subscription cancelled', result);
          setStatus('Subscription cancelled.', 'ok');
        } catch (error) {
          setStatus(error.message, 'error');
          log('Cancel subscription failed', serializeError(error));
        }
      }

      async function loadPortal() {
        setStatus('Loading customer portal data...');

        try {
          const result = await apiFetch('/freemius/customer-portal');
          log('Customer portal', result);
          setStatus('Customer portal data loaded.', 'ok');
        } catch (error) {
          setStatus(error.message, 'error');
          log('Customer portal failed', serializeError(error));
        }
      }

      async function apiFetch(path, options = {}) {
        const apiUrl = fields.apiUrl.value.replace(/\/+$/, '');
        const token = fields.token.value.trim();

        if (!apiUrl) {
          throw new Error('API URL is required.');
        }

        if (!token) {
          throw new Error('Bearer token is required.');
        }

        const response = await fetch(`${apiUrl}${path}`, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            Authorization: `Bearer ${token}`,
            ...(options.headers ?? {}),
          },
        });

        const contentType = response.headers.get('content-type') ?? '';
        const data = contentType.includes('application/json')
          ? await response.json()
          : await response.text();

        if (!response.ok) {
          throw new Error(
            typeof data === 'string'
              ? data
              : (data.message ?? `HTTP ${response.status}`),
          );
        }

        return data;
      }

      function cleanPayload(payload) {
        return Object.fromEntries(
          Object.entries(payload).filter(([, value]) => {
            return value !== '' && value !== undefined && !Number.isNaN(value);
          }),
        );
      }

      function updateCheckoutButtons() {
        buttons.openOverlay.disabled = !state.checkout?.options;
        buttons.openHosted.disabled = !state.checkout?.link;
      }

      function setStatus(message, type = '') {
        statusEl.textContent = message;
        statusEl.className = `status ${type}`.trim();
      }

      function log(label, data) {
        const now = new Date().toISOString();
        logEl.textContent = `[${now}] ${label}\n${JSON.stringify(
          data,
          null,
          2,
        )}\n\n${logEl.textContent}`;
      }

      function serializeError(error) {
        return {
          message: error?.message ?? String(error),
          stack: error?.stack,
        };
      }

      function persistForm() {
        localStorage.setItem(
          'freemius-test-form',
          JSON.stringify({
            apiUrl: fields.apiUrl.value,
            token: fields.token.value,
            planId: fields.planId.value,
            quota: fields.quota.value,
            licenseId: fields.licenseId.value,
          }),
        );
      }

      function restoreForm() {
        try {
          const saved = JSON.parse(
            localStorage.getItem('freemius-test-form') ?? '{}',
          );

          for (const [key, value] of Object.entries(saved)) {
            if (fields[key] && typeof value === 'string') {
              fields[key].value = value;
            }
          }
        } catch {
          localStorage.removeItem('freemius-test-form');
        }
      }

      function escapeHtml(value) {
        const div = document.createElement('div');
        div.textContent = value;
        return div.innerHTML;
      }
    </script>
  </body>
</html>
