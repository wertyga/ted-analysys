<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Google Auth Test</title>
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
      }

      body {
        margin: 0;
        background: #f6f7f9;
        color: #1f2933;
      }

      main {
        max-width: 760px;
        margin: 0 auto;
        padding: 32px 20px;
      }

      h1 {
        margin: 0 0 20px;
        font-size: 28px;
        font-weight: 700;
      }

      section {
        margin-top: 16px;
        padding: 20px;
        border: 1px solid #d9dee7;
        border-radius: 8px;
        background: #fff;
      }

      label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 600;
        color: #52606d;
      }

      input,
      textarea {
        box-sizing: border-box;
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #cbd2d9;
        border-radius: 6px;
        font: inherit;
      }

      textarea {
        min-height: 112px;
        resize: vertical;
      }

      button {
        min-height: 40px;
        padding: 0 14px;
        border: 0;
        border-radius: 6px;
        background: #1f2933;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }

      button:disabled {
        cursor: not-allowed;
        opacity: 0.55;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      .full {
        grid-column: 1 / -1;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
      }

      pre {
        overflow: auto;
        min-height: 120px;
        margin: 0;
        padding: 14px;
        border-radius: 6px;
        background: #101820;
        color: #e4e7eb;
        font-size: 13px;
        line-height: 1.45;
      }

      .muted {
        color: #697586;
        font-size: 13px;
      }

      @media (max-width: 640px) {
        .grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Google Auth Test</h1>

      <section>
        <div class="grid">
          <div class="full">
            <label for="clientId">Google OAuth Client ID</label>
            <input
              id="clientId"
              autocomplete="off"
              placeholder="1234567890-xxxx.apps.googleusercontent.com"
            />
          </div>

          <div>
            <label for="country">Country</label>
            <input id="country" value="PLN" />
          </div>

          <div>
            <label for="companySize">Company size</label>
            <input id="companySize" value="SME" />
          </div>

          <div>
            <label for="operatingRegions">Operating regions</label>
            <input id="operatingRegions" value="PLN,GR" />
          </div>

          <div>
            <label for="industries">Industries</label>
            <input id="industries" value="3200000,32100000" />
          </div>

          <div>
            <label for="mainServices">Main services</label>
            <input id="mainServices" value="3201000,32110000" />
          </div>

          <div>
            <label for="languages">Languages</label>
            <input id="languages" value="ENG,PLN" />
          </div>

          <div class="full">
            <label for="companyDescription">Company description</label>
            <textarea id="companyDescription">
Software development company focused on public sector systems.</textarea
            >
          </div>
        </div>

        <div class="actions" style="margin-top: 16px">
          <button id="initButton" type="button">Initialize Google button</button>
          <div id="googleButton"></div>
        </div>
        <p class="muted">
          Add this page origin to the Google OAuth Client authorized JavaScript
          origins.
        </p>
      </section>

      <section>
        <label>Result</label>
        <pre id="result">Waiting...</pre>
      </section>
    </main>

    <script>
      const result = document.getElementById("result");
      const clientIdInput = document.getElementById("clientId");
      const initButton = document.getElementById("initButton");
      const googleButton = document.getElementById("googleButton");

      clientIdInput.value = localStorage.getItem("googleClientId") || "";

      function print(value) {
        result.textContent =
          typeof value === "string" ? value : JSON.stringify(value, null, 2);
      }

      function csv(id) {
        return document
          .getElementById(id)
          .value.split(",")
          .map((value) => value.trim())
          .filter(Boolean);
      }

      function decodeJwt(token) {
        const base64 = token.split(".")[1].replace(/-/g, "+").replace(/_/g, "/");
        const json = decodeURIComponent(
          atob(base64)
            .split("")
            .map((char) => {
              return "%" + ("00" + char.charCodeAt(0).toString(16)).slice(-2);
            })
            .join(""),
        );

        return JSON.parse(json);
      }

      async function sendToBackend(googleProfile) {
        const payload = {
          email: googleProfile.email,
          companyName: googleProfile.name || googleProfile.email,
          country: document.getElementById("country").value.trim(),
          operatingRegions: csv("operatingRegions"),
          companySize: document.getElementById("companySize").value.trim(),
          companyDescription: document
            .getElementById("companyDescription")
            .value.trim(),
          industries: csv("industries"),
          mainServices: csv("mainServices"),
          languages: csv("languages"),
        };

        print({ step: "sending", payload, googleProfile });

        const response = await fetch("/auth/oauth/google", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });

        const body = await response.json().catch(() => null);

        print({
          status: response.status,
          ok: response.ok,
          response: body,
          payload,
        });
      }

      initButton.addEventListener("click", () => {
        const clientId = clientIdInput.value.trim();

        if (!clientId) {
          print("Google OAuth Client ID is required.");
          return;
        }

        if (!window.google?.accounts?.id) {
          print("Google Identity Services script is not loaded yet.");
          return;
        }

        localStorage.setItem("googleClientId", clientId);
        googleButton.innerHTML = "";

        google.accounts.id.initialize({
          client_id: clientId,
          callback: async (credentialResponse) => {
            try {
              const googleProfile = decodeJwt(credentialResponse.credential);
              await sendToBackend(googleProfile);
            } catch (error) {
              print({
                error: error instanceof Error ? error.message : String(error),
              });
            }
          },
        });

        google.accounts.id.renderButton(googleButton, {
          theme: "outline",
          size: "large",
          text: "signin_with",
          shape: "rectangular",
        });

        print("Google button initialized.");
      });
    </script>
  </body>
</html>
